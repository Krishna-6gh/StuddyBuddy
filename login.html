<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBuddy — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --emerald:#10b981;--emerald-dark:#059669;--emerald-deep:#047857;
  --mint:#d1fae5;--teal:#0d9488;
  --ink:#0a0f1e;--ink-2:#1e293b;--muted:#64748b;
  --surface:#ffffff;--glass:rgba(255,255,255,0.7);
  --err:#ef4444;
}
body{
  font-family:'DM Sans',sans-serif;
  background:#f0fdf8;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  position:relative;
}

/* ---- ANIMATED BG ---- */
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
.blob{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;
  animation:drift 12s ease-in-out infinite alternate;
}
.blob1{width:500px;height:500px;background:radial-gradient(#6ee7b7,#10b981);top:-100px;left:-100px;animation-delay:0s}
.blob2{width:400px;height:400px;background:radial-gradient(#a7f3d0,#34d399);bottom:-100px;right:-80px;animation-delay:-4s}
.blob3{width:300px;height:300px;background:radial-gradient(#5eead4,#0d9488);top:40%;left:60%;animation-delay:-8s}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(30px,20px) scale(1.06)}
}

/* ---- CARD ---- */
.card-wrap{
  position:relative;z-index:10;
  width:420px;max-width:96vw;
  animation:slideUp .7s cubic-bezier(.16,1,.3,1) both;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}
.card{
  background:rgba(255,255,255,0.82);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.9);
  border-radius:28px;
  padding:44px 40px 36px;
  box-shadow:0 20px 60px rgba(16,185,129,.12),0 4px 16px rgba(0,0,0,.06);
}

/* Logo */
.logo{
  display:flex;align-items:center;gap:10px;margin-bottom:30px;
}
.logo-icon{
  width:44px;height:44px;
  background:linear-gradient(135deg,#10b981,#0d9488);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 4px 14px rgba(16,185,129,.4);
  animation:pulse 2.5s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 4px 14px rgba(16,185,129,.4)}
  50%{box-shadow:0 4px 24px rgba(16,185,129,.7)}
}
.logo-name{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:var(--ink)}

/* Mode Toggle Tabs */
.tabs{
  display:flex;background:#f1f5f9;border-radius:14px;padding:4px;margin-bottom:28px;
}
.tab{
  flex:1;padding:10px;text-align:center;font-weight:600;font-size:.9rem;
  border-radius:10px;cursor:pointer;border:none;background:transparent;
  color:var(--muted);transition:all .3s ease;
}
.tab.active{
  background:white;color:var(--emerald);
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

/* Fields */
.fields{overflow:hidden}
.field{
  margin-bottom:16px;
  animation:fadeIn .4s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.field label{
  display:block;font-size:.8rem;font-weight:600;
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;
  margin-bottom:6px;
}
.input-wrap{position:relative}
.input-wrap svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--muted);pointer-events:none;
}
.field input{
  width:100%;padding:13px 14px 13px 42px;
  border:1.5px solid #e2e8f0;border-radius:12px;
  font-family:'DM Sans',sans-serif;font-size:.95rem;
  background:white;color:var(--ink);
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.field input:focus{
  border-color:var(--emerald);
  box-shadow:0 0 0 3px rgba(16,185,129,.15);
}
.field input.error{border-color:var(--err)}
.err-msg{
  font-size:.78rem;color:var(--err);margin-top:4px;
  display:none;
}
.err-msg.show{display:block}

/* CTA Button */
.btn{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:white;font-weight:700;font-size:1rem;
  border:none;border-radius:14px;cursor:pointer;
  margin-top:8px;
  box-shadow:0 4px 20px rgba(16,185,129,.35);
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,.15);
  transform:translateX(-100%);
  transition:transform .4s ease;
}
.btn:hover::after{transform:translateX(100%)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(16,185,129,.45)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed}

/* Divider */
.divider{
  display:flex;align-items:center;gap:12px;margin:18px 0;
}
.divider span{font-size:.8rem;color:var(--muted)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e2e8f0}

/* Footer link */
.footer-link{
  text-align:center;font-size:.88rem;color:var(--muted);margin-top:14px;
}
.footer-link a{color:var(--emerald);font-weight:600;cursor:pointer;text-decoration:none}
.footer-link a:hover{text-decoration:underline}

/* Toast */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--ink);color:white;padding:14px 22px;
  border-radius:14px;font-size:.9rem;font-weight:500;
  transition:transform .4s cubic-bezier(.16,1,.3,1);
  z-index:999;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:#dc2626}
.toast.ok{background:#059669}

/* Spinner */
.spinner{
  display:inline-block;width:18px;height:18px;
  border:2.5px solid rgba(255,255,255,.4);
  border-top-color:white;border-radius:50%;
  animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<div class="card-wrap">
  <div class="card">

    <div class="logo">
      <div class="logo-icon">📚</div>
      <span class="logo-name">StudyBuddy</span>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
      <button class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="fields">
      <div class="field" style="animation-delay:.05s">
        <label>Email Address</label>
        <div class="input-wrap">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <input type="email" id="li_email" placeholder="you@email.com">
        </div>
        <div class="err-msg" id="li_email_err">Please enter a valid email</div>
      </div>
      <div class="field" style="animation-delay:.1s">
        <label>Password</label>
        <div class="input-wrap">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" stroke-linecap="round"/><path stroke-linecap="round" d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input type="password" id="li_pass" placeholder="••••••••">
        </div>
        <div class="err-msg" id="li_pass_err">Password required</div>
      </div>
      <button class="btn" id="loginBtn" onclick="doLogin()">Login to StudyBuddy</button>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" class="fields" style="display:none">
      <div class="field" style="animation-delay:.02s">
        <label>I am a...</label>
        <div class="tabs" style="margin-bottom:0; padding:4px;">
          <button type="button" class="tab active" id="roleStudent" onclick="selectRole('Student')">Student</button>
          <button type="button" class="tab" id="roleTeacher" onclick="selectRole('Teacher')">Teacher</button>
          <button type="button" class="tab" id="roleOrg" onclick="selectRole('Organisation')">Organisation</button>
        </div>
      </div>
      <div class="field" id="orgCodeField" style="display:none; animation-delay:.03s">
        <label>Organization Unique Code</label>
        <div class="input-wrap">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/></svg>
          <input type="text" id="su_orgcode" placeholder="Enter code">
        </div>
        <div class="err-msg" id="su_orgcode_err">Code required</div>
      </div>
      <div class="field" style="animation-delay:.05s">
        <label>Full Name</label>
        <div class="input-wrap">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="8" r="4" stroke-linecap="round"/><path stroke-linecap="round" d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input type="text" id="su_name" placeholder="Your full name">
        </div>
        <div class="err-msg" id="su_name_err">Name is required</div>
      </div>
      <div class="field" style="animation-delay:.1s">
        <label>Email Address</label>
        <div class="input-wrap">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <input type="email" id="su_email" placeholder="you@email.com">
        </div>
        <div class="err-msg" id="su_email_err">Valid email required</div>
      </div>
      <div class="field" style="animation-delay:.15s">
        <label>Password</label>
        <div class="input-wrap">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" stroke-linecap="round"/><path stroke-linecap="round" d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input type="password" id="su_pass" placeholder="Min 6 characters">
        </div>
        <div class="err-msg" id="su_pass_err">At least 6 characters</div>
      </div>
      <button class="btn" id="signupBtn" onclick="doSignup()">Create Account</button>
    </div>

    <!-- VERIFY FORM -->
    <div id="verifyForm" class="fields" style="display:none">
      <div style="text-align:center; padding: 10px; margin-bottom:10px;">
        <span style="font-size: 2.5rem;">📱</span>
        <h3 style="margin: 8px 0; color:var(--ink); font-family:'Syne',sans-serif;">Verify Account</h3>
        <p style="font-size:0.85rem; color:var(--muted); line-height:1.4;">We sent a 4-digit code to your email.<br>Please enter it to verify.</p>
      </div>
      <div class="field" style="animation-delay:.05s">
        <label>4-Digit Code</label>
        <div class="input-wrap">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <input type="text" id="su_code" placeholder="0000" maxlength="4" style="text-align:center; letter-spacing:8px; font-weight:700; font-size:1.2rem;">
        </div>
        <div class="err-msg" id="su_code_err">Invalid code</div>
      </div>
      <button class="btn" id="verifyBtn" onclick="doVerify()">Verify & Continue</button>
    </div>

    <div class="footer-link" id="footerLink">
      New here? <a onclick="switchTab('signup')">Create an account</a>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* Auto-redirect if logged in */
if(localStorage.getItem('sb_current_user')){
  window.location.href='registration.html';
}

let selectedRole = 'Student';
function selectRole(role) {
  selectedRole = role;
  document.getElementById('roleStudent').classList.toggle('active', role === 'Student');
  document.getElementById('roleTeacher').classList.toggle('active', role === 'Teacher');
  document.getElementById('roleOrg').classList.toggle('active', role === 'Organisation');
  const orgField = document.getElementById('orgCodeField');
  if(orgField) {
    orgField.style.display = role === 'Organisation' ? 'block' : 'none';
    orgField.style.animation = 'none';
    if(role === 'Organisation') {
      setTimeout(()=>orgField.style.animation = 'fadeIn .4s ease both', 10);
    }
  }
}

function switchTab(mode){
  const isLogin = mode==='login';
  document.getElementById('tabLogin').classList.toggle('active',isLogin);
  document.getElementById('tabSignup').classList.toggle('active',!isLogin);
  const lf=document.getElementById('loginForm');
  const sf=document.getElementById('signupForm');
  const fl=document.getElementById('footerLink');

  if(isLogin){
    sf.style.display='none';
    lf.style.display='block';
    lf.querySelectorAll('.field').forEach((f,i)=>{f.style.animation='none';setTimeout(()=>{f.style.animation=`fadeIn .4s ease ${i*0.05}s both`},10)});
    fl.innerHTML='New here? <a onclick="switchTab(\'signup\')">Create an account</a>';
  }else{
    lf.style.display='none';
    sf.style.display='block';
    sf.querySelectorAll('.field').forEach((f,i)=>{f.style.animation='none';setTimeout(()=>{f.style.animation=`fadeIn .4s ease ${i*0.05}s both`},10)});
    fl.innerHTML='Already have an account? <a onclick="switchTab(\'login\')">Login</a>';
  }
}

function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+(type==='err'?'err':'ok');
  setTimeout(()=>t.className='toast',3000);
}

function setLoading(btn,loading){
  btn.disabled=loading;
  if(loading) btn.innerHTML='<span class="spinner"></span> Please wait...';
}

function clearErrors(){
  document.querySelectorAll('.err-msg').forEach(e=>e.classList.remove('show'));
  document.querySelectorAll('input').forEach(i=>i.classList.remove('error'));
}

function showErr(id,msg){
  const inp=document.getElementById(id);
  const err=document.getElementById(id+'_err');
  inp.classList.add('error');
  if(msg) err.textContent=msg;
  err.classList.add('show');
}

function doLogin(){
  clearErrors();
  const email=document.getElementById('li_email').value.trim();
  const pass=document.getElementById('li_pass').value;
  let ok=true;
  if(!email||!/\S+@\S+\.\S+/.test(email)){showErr('li_email');ok=false}
  if(!pass){showErr('li_pass');ok=false}
  if(!ok) return;

  const btn=document.getElementById('loginBtn');
  setLoading(btn,true);

  setTimeout(()=>{
    const users=JSON.parse(localStorage.getItem('sb_users')||'[]');
    const user=users.find(u=>u.email===email&&u.password===pass);
    if(!user){
      toast('Invalid email or password','err');
      btn.textContent='Login to StudyBuddy';
      btn.disabled=false;
      return;
    }
    localStorage.setItem('sb_current_user',JSON.stringify(user));
    toast('Welcome back, '+user.name+'! 🎉');
    setTimeout(()=>{
      if(!user.subjects||user.subjects.length===0)
        window.location.href='registration.html';
      else window.location.href='dashboard.html';
    },1000);
  },800);
}

function doSignup(){
  clearErrors();
  const name=document.getElementById('su_name').value.trim();
  const email=document.getElementById('su_email').value.trim();
  const pass=document.getElementById('su_pass').value;
  let ok=true;
  if(!name){showErr('su_name','Full name is required');ok=false}
  if(!email||!/\S+@\S+\.\S+/.test(email)){showErr('su_email','Valid email required');ok=false}
  if(!pass||pass.length<6){showErr('su_pass','At least 6 characters');ok=false}
  
  let orgCode = '';
  if(selectedRole === 'Organisation') {
    orgCode = document.getElementById('su_orgcode').value.trim();
    if(!orgCode) { showErr('su_orgcode', 'Organization code required'); ok=false; }
  }
  if(!ok) return;

  const users=JSON.parse(localStorage.getItem('sb_users')||'[]');
  if(users.find(u=>u.email===email)){
    toast('This email is already registered','err');
    showErr('su_email','Email already in use');
    return;
  }

  const btn=document.getElementById('signupBtn');
  setLoading(btn,true);

  setTimeout(()=>{
    document.getElementById('signupForm').style.display='none';
    document.getElementById('footerLink').style.display='none';
    document.querySelector('.tabs').style.display='none';
    
    const vf = document.getElementById('verifyForm');
    vf.style.display='block';
    vf.querySelectorAll('.field').forEach((f,i)=>{f.style.animation='none';setTimeout(()=>{f.style.animation=`fadeIn .4s ease ${i*0.05}s both`},10)});
    
    toast('Verification code sent! 🚀');
    btn.textContent='Create Account';
    btn.disabled=false;

    window.pendingUser = {name,email,password:pass, role:selectedRole, orgCode, subjects:[]};
  },800);
}

function doVerify(){
  clearErrors();
  const code = document.getElementById('su_code').value.trim();
  if(!code || code.length < 4){
    showErr('su_code', 'Please enter 4 digits'); return;
  }
  
  const btn = document.getElementById('verifyBtn');
  setLoading(btn, true);
  
  setTimeout(()=>{
    const users=JSON.parse(localStorage.getItem('sb_users')||'[]');
    users.push(window.pendingUser);
    localStorage.setItem('sb_users',JSON.stringify(users));
    localStorage.setItem('sb_current_user',JSON.stringify(window.pendingUser));
    
    toast('Verification successful! 🎉');
    setTimeout(()=>window.location.href='registration.html',1000);
  }, 1000);
}
</script>
</body>
</html>
